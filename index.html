<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRLN LFT - CRM</title>
    <link rel="icon" type="image/png" href="goiaba.png">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --border-color: #2f2f37;
            --text-color: #e1e1e6;
            --text-muted: #a4a4b5;
            --primary-color: #4ade80;
            --primary-hover: #22c55e;
            --input-bg: #202024;
            --warn-color: #fbbf24;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 10px;
        }

        .title-wrapper img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin: 0; /* Removido margin-bottom para o wrapper assumir */
            font-weight: 600;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 18px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        input.duplicado {
            border-color: var(--warn-color);
        }

        .aviso-duplicado {
            display: none;
            margin-top: 8px;
            padding: 10px 12px;
            background-color: rgba(251, 191, 36, 0.08);
            border: 1px solid var(--warn-color);
            border-radius: 6px;
            color: var(--warn-color);
            font-size: 13px;
            line-height: 1.5;
        }

        .aviso-duplicado.visivel {
            display: block;
        }

        .aviso-duplicado button {
            width: auto;
            margin: 6px 0 0 0;
            padding: 6px 10px;
            font-size: 12px;
            background-color: var(--warn-color);
            color: #000;
            display: block;
        }

        .aviso-duplicado button:hover {
            background-color: #f59e0b;
        }

        textarea {
            height: 140px;
            resize: vertical;
        }

        .paste-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            background-color: var(--input-bg);
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .paste-area.active {
            border-color: var(--primary-color);
            color: var(--primary-color);
            background-color: rgba(74, 222, 128, 0.05);
        }

        .preview-img {
            max-width: 100%;
            max-height: 200px;
            margin-top: 15px;
            border-radius: 6px;
            display: none;
            border: 1px solid var(--border-color);
        }

        button {
            width: 100%;
            padding: 18px;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .search-section {
            border-top: 1px solid var(--border-color);
            padding-top: 30px;
        }

        .search-box {
            position: relative;
        }

        .results-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .result-item {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .result-item:hover {
            transform: translateY(-2px);
            border-color: var(--primary-color);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .result-meta {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .badge {
            background-color: var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .search-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .search-header h2 {
            margin: 0;
            text-align: left;
        }

        .btn-sec {
            width: auto;
            margin: 0;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .btn-sec:hover {
            background-color: #3a3a42;
        }

        .contador {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .ultima-interacao {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .acoes {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .acoes .btn-sec {
            flex: 1;
        }

        .historico {
            display: none;
            margin-top: 15px;
            padding: 14px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 320px;
            overflow-y: auto;
        }

        .historico.aberto {
            display: block;
        }

        .anexos-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .anexos-links a {
            color: var(--primary-color);
            font-size: 13px;
            text-decoration: none;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 8px;
        }

        .anexos-links a:hover {
            border-color: var(--primary-color);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="title-wrapper">
            <img src="goiaba.png" alt="Logo Goiaba">
            <h2 id="form-title">CRLN LFT</h2>
        </div>
        
        <form id="crmForm">
            <input type="hidden" id="clientId">
            
            <div class="form-group">
                <label for="nome">Nome do Cliente</label>
                <input type="text" id="nome" required placeholder="Ex: João Silva">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="conta">Conta</label>
                    <input type="text" id="conta" placeholder="Ex: ACME Corp">
                </div>
                <div class="form-group">
                    <label for="tipoConta">Tipo de Conta</label>
                    <select id="tipoConta">
                        <option value="Lead">Teste</option>
                        <option value="Lead">Afiliados</option>
                        <option value="Cliente Ativo">Funded</option>
                        <option value="Parceiro">Não Cliente</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="joao@email.com" autocomplete="off">
                    <div class="aviso-duplicado" id="avisoEmail"></div>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" placeholder="(11) 99999-9999" autocomplete="off">
                    <div class="aviso-duplicado" id="avisoTelefone"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="assunto">Assunto</label>
                <input type="text" id="assunto" placeholder="Ex: Dúvida sobre faturamento">
            </div>

            <div class="form-group">
                <label for="conversa">Conversa / Registro</label>
                <textarea id="conversa" required placeholder="Digite aqui o resumo do que foi conversado..."></textarea>
            </div>

            <div class="form-group">
                <label>Anexos (Prints de Tela)</label>
                <div class="paste-area" id="pasteArea">
                    Clique aqui e aperte <strong>Ctrl + V</strong> para colar um print
                    <img id="preview" class="preview-img" alt="Preview do print">
                </div>
            </div>

            <button type="submit" id="btnSalvar">Salvar Registro</button>
            <button type="button" id="btnCancelar" style="display:none; background-color:#3a3a42; color:#fff; margin-top:5px;">Cancelar Edição / Novo</button>
        </form>
    </div>

    <div class="card search-section">
        <div class="search-header">
            <h2>Buscar Clientes</h2>
            <button type="button" class="btn-sec" id="btnAtualizar" onclick="atualizarBase()">Atualizar lista</button>
        </div>
        <div class="search-box">
            <input type="text" id="searchBar" placeholder="Pesquise por nome, empresa, e-mail, telefone ou ID..." oninput="buscarClientes()" autocomplete="off">
        </div>
        <div class="contador" id="contadorResultados"></div>
        <div class="results-list" id="resultsList">
            <!-- Resultados aparecem aqui dinamicamente -->
        </div>
    </div>
</div>

<script>
    // =========================================================================
    // APPS SCRIPT 
    // =========================================================================
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx-iuUPLgFLfY-Z1MDL7PWHKfAo-fnKHvOy6nbB0lUKgflQDlq7SeZxl5rDDMe_FJic/exec";
    
    let imageBase64 = "";
    const pasteArea = document.getElementById('pasteArea');
    const preview = document.getElementById('preview');

    // =========================================================================
    // CONTROLE DE DUPLICIDADE (e-mail / telefone)
    // O cache agora atua como uma barreira preliminar imediata.
    // A validação definitiva contra concorrência repousa no Backend.
    // =========================================================================
    let clientesCache = [];
    let cacheCarregado = false;

    function normalizarEmail(v) {
        return String(v || '').trim().toLowerCase();
    }

    function normalizarTelefone(v) {
        let d = String(v || '').replace(/\D/g, '');
        if (d.length >= 12 && d.startsWith('55')) d = d.slice(2);
        if (d.length >= 11 && d.startsWith('0')) d = d.replace(/^0+/, '');
        return d;
    }

    function carregarCache() {
        return fetch(`${WEB_APP_URL}?q=`)
            .then(r => r.json())
            .then(data => {
                if (!Array.isArray(data)) throw new Error('Resposta inesperada do Apps Script');
                clientesCache = data;
                cacheCarregado = true;
                return clientesCache;
            });
    }

    function acharDuplicado(campo) {
        const idAtual = String(document.getElementById('clientId').value || '');
        let valor, chave, normalizar;

        if (campo === 'email') {
            valor = normalizarEmail(document.getElementById('email').value);
            normalizar = normalizarEmail;
            chave = 'email';
            if (!valor) return null;
        } else {
            valor = normalizarTelefone(document.getElementById('telefone').value);
            normalizar = normalizarTelefone;
            chave = 'telefone';
            if (valor.length < 8) return null; 
        }

        return clientesCache.find(c =>
            String(c.id) !== idAtual && normalizar(c[chave]) === valor
        ) || null;
    }

    function mostrarAviso(campo) {
        const input = document.getElementById(campo);
        const aviso = document.getElementById(campo === 'email' ? 'avisoEmail' : 'avisoTelefone');
        const dup = acharDuplicado(campo);

        aviso.innerHTML = '';
        if (!dup) {
            aviso.classList.remove('visivel');
            input.classList.remove('duplicado');
            return null;
        }

        const rotulo = campo === 'email' ? 'E-mail' : 'Telefone';
        const texto = document.createElement('span');
        texto.textContent = `${rotulo} já cadastrado para ${dup.nome} (ID ${dup.id}).`;
        aviso.appendChild(texto);

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = 'Adicionar interação a este cliente';
        btn.addEventListener('click', () => carregarParaEdicao(dup));
        aviso.appendChild(btn);

        aviso.classList.add('visivel');
        input.classList.add('duplicado');
        return dup;
    }

    function verificarDuplicidade() {
        return { email: mostrarAviso('email'), telefone: mostrarAviso('telefone') };
    }

    let duplicidadeTimeout;
    function agendarVerificacao() {
        clearTimeout(duplicidadeTimeout);
        duplicidadeTimeout = setTimeout(verificarDuplicidade, 300);
    }

    ['email', 'telefone'].forEach(id => {
        const el = document.getElementById(id);
        el.addEventListener('input', agendarVerificacao);
        el.addEventListener('blur', verificarDuplicidade);
    });

    window.addEventListener('paste', function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') === 0) {
                const blob = items[i].getAsFile();
                const reader = new FileReader();
                reader.onload = function(event) {
                    imageBase64 = event.target.result;
                    preview.src = imageBase64;
                    preview.style.display = 'block';
                    pasteArea.classList.add('active');
                    pasteArea.innerHTML = `Print carregado com sucesso! (Aperte Ctrl+V para trocar)<br>`;
                    pasteArea.appendChild(preview);
                };
                reader.readAsDataURL(blob);
            }
        }
    });

    // =========================================================================
    // Remove overhead desnecessário de request full pré-envio
    // =========================================================================
    document.getElementById('crmForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSalvar');
        btn.innerText = "Verificando dados...";
        btn.disabled = true;

        // 1) Usar cache existente para verificação preliminar em milissegundos
        const dups = verificarDuplicidade();
        if (dups.email || dups.telefone) {
            const quem = (dups.email || dups.telefone);
            alert(
                'Registro não salvo: ' +
                (dups.email && dups.telefone && dups.email.id !== dups.telefone.id
                    ? 'e-mail e telefone pertencem a clientes diferentes já cadastrados.'
                    : `já existe um cliente com este ${dups.email ? 'e-mail' : 'telefone'}: ${quem.nome} (ID ${quem.id}).`) +
                '\n\nUse o botão no aviso amarelo para adicionar uma nova interação ao cliente existente.'
            );
            btn.innerText = "Salvar Registro";
            btn.disabled = false;
            return; // Bloqueia localmente sem gastar rede
        }

        // 2) Sem duplicidade local: Delega a responsabilidade definitiva para o servidor
        btn.innerText = "Enviando dados...";

        const payload = {
            id: document.getElementById('clientId').value || null,
            nome: document.getElementById('nome').value,
            conta: document.getElementById('conta').value,
            tipoConta: document.getElementById('tipoConta').value,
            email: document.getElementById('email').value,
            telefone: document.getElementById('telefone').value,
            assunto: document.getElementById('assunto').value,
            conversa: document.getElementById('conversa').value,
            imageBlob: imageBase64 
        };

        fetch(WEB_APP_URL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                alert('Registro salvo.');
                resetarFormulario();
                // Apenas aqui recarrega o DB full do servidor
                carregarCache().then(renderBusca).catch(err => console.warn('Falha ao atualizar a lista:', err));
            } else {
                // Caso o backend tenha interceptado uma duplicidade recente não mapeada no frontend
                alert('Falha na operação: ' + (data.message || 'Erro validando os dados no servidor.'));
            }
        })
        .catch(error => {
            console.error('Erro de rede:', error);
            alert('Erro de comunicação. Verifique se o Apps Script foi implantado como "Qualquer pessoa".');
        })
        .finally(() => {
            btn.innerText = "Salvar Registro";
            btn.disabled = false;
        });
    });

    const TIPOS_CONTA = { 'Lead': 'Teste', 'Cliente Ativo': 'Funded', 'Parceiro': 'Não Cliente' };
    const LIMITE_RESULTADOS = 50;

    function semAcento(v) {
        return String(v == null ? '' : v).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function correspondeBusca(c, tokens) {
        const campos = Object.values(c || {}).map(valor => {
            if (valor == null) return '';
            if (typeof valor === 'object') {
                try { return JSON.stringify(valor); }
                catch (_) { return String(valor); }
            }
            return String(valor);
        });

        const textoCompleto = semAcento(campos.join(' '));
        const digitosRegistro = campos.join(' ').replace(/\D/g, '');

        return tokens.every(t => {
            if (textoCompleto.includes(t)) return true;
            if (/^[\d\s()+./-]+$/.test(t)) {
                const digitosBusca = t.replace(/\D/g, '');
                return digitosBusca.length > 0 && digitosRegistro.includes(digitosBusca);
            }
            return false;
        });
    }

    function criar(tag, classe, texto) {
        const el = document.createElement(tag);
        if (classe) el.className = classe;
        if (texto != null) el.textContent = texto;
        return el;
    }

    function linhaMeta(rotulo, valor) {
        const div = criar('div');
        div.appendChild(criar('strong', null, rotulo + ': '));
        div.appendChild(document.createTextNode(valor || '-'));
        return div;
    }

    function montarCard(item) {
        const card = criar('div', 'result-item');

        const header = criar('div', 'result-header');
        header.appendChild(criar('span', null, item.nome));
        header.appendChild(criar('span', 'badge', TIPOS_CONTA[item.tipoConta] || item.tipoConta));
        card.appendChild(header);

        const meta = criar('div', 'result-meta');
        meta.appendChild(linhaMeta('Empresa', item.conta));
        meta.appendChild(linhaMeta('ID', item.id));
        meta.appendChild(linhaMeta('Contato', [item.email, item.telefone].filter(Boolean).join(' | ')));
        meta.appendChild(linhaMeta('Assunto', item.assunto));
        card.appendChild(meta);

        const historico = String(item.conversa || '');
        const ultima = historico.split('\n')[0].trim();
        if (ultima) {
            const prev = ultima.length > 160 ? ultima.slice(0, 160) + '…' : ultima;
            card.appendChild(criar('div', 'ultima-interacao', 'Última interação: ' + prev));
        }

        const acoes = criar('div', 'acoes');

        const btnInteracao = criar('button', 'btn-sec', 'Nova interação');
        btnInteracao.type = 'button';
        btnInteracao.addEventListener('click', () => carregarParaEdicao(item));
        acoes.appendChild(btnInteracao);

        const painel = criar('div', 'historico');
        painel.textContent = historico || 'Sem histórico registrado.';

        const links = String(item.anexos || '').split(/\s+/).filter(u => u.startsWith('https://'));
        if (links.length) {
            const bloco = criar('div', 'anexos-links');
            links.forEach((url, i) => {
                const a = criar('a', null, 'Print ' + (links.length - i));
                a.href = url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                bloco.appendChild(a);
            });
            painel.appendChild(bloco);
        }

        if (historico || links.length) {
            const btnHist = criar('button', 'btn-sec', 'Ver histórico');
            btnHist.type = 'button';
            btnHist.addEventListener('click', () => {
                const aberto = painel.classList.toggle('aberto');
                btnHist.textContent = aberto ? 'Ocultar histórico' : 'Ver histórico';
            });
            acoes.appendChild(btnHist);
        }

        card.appendChild(acoes);
        card.appendChild(painel);
        return card;
    }

    function renderBusca() {
        const resultsList = document.getElementById('resultsList');
        const contador = document.getElementById('contadorResultados');

        if (!cacheCarregado) {
            resultsList.innerHTML = '<p style="color: var(--text-muted);">Carregando base de dados...</p>';
            contador.textContent = '';
            return;
        }

        const tokens = semAcento(document.getElementById('searchBar').value).trim().split(/\s+/).filter(Boolean);
        const filtrados = clientesCache.filter(c => correspondeBusca(c, tokens)).reverse();

        resultsList.innerHTML = '';
        if (filtrados.length === 0) {
            resultsList.innerHTML = '<p style="color: var(--text-muted);">Nenhum registro encontrado.</p>';
            contador.textContent = '0 de ' + clientesCache.length + ' clientes';
            return;
        }

        const visiveis = filtrados.slice(0, LIMITE_RESULTADOS);
        visiveis.forEach(item => resultsList.appendChild(montarCard(item)));

        contador.textContent = filtrados.length > LIMITE_RESULTADOS
            ? `Mostrando os ${LIMITE_RESULTADOS} mais recentes de ${filtrados.length} resultados. Refine a busca para ver os demais.`
            : `${filtrados.length} de ${clientesCache.length} clientes`;
    }

    let buscaTimeout;
    function buscarClientes() {
        clearTimeout(buscaTimeout);
        buscaTimeout = setTimeout(renderBusca, 150);
    }

    function atualizarBase() {
        const btn = document.getElementById('btnAtualizar');
        btn.disabled = true;
        btn.textContent = 'Atualizando...';
        carregarCache()
            .then(() => { renderBusca(); verificarDuplicidade(); })
            .catch(err => {
                console.error('Erro ao atualizar:', err);
                alert('Não foi possível atualizar a lista agora. Tente novamente em instantes.');
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Atualizar lista';
            });
    }

    function carregarParaEdicao(item) {
        document.getElementById('clientId').value = item.id;
        document.getElementById('nome').value = item.nome;
        document.getElementById('conta').value = item.conta;
        document.getElementById('tipoConta').value = item.tipoConta;
        document.getElementById('email').value = item.email;
        document.getElementById('telefone').value = item.telefone;
        document.getElementById('assunto').value = item.assunto;
        
        document.getElementById('conversa').value = ""; 
        
        document.getElementById('form-title').innerText = "Adicionando Interação - " + item.nome;
        document.getElementById('btnCancelar').style.display = "block";
        verificarDuplicidade(); 
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetarFormulario() {
        document.getElementById('crmForm').reset();
        document.getElementById('clientId').value = '';
        document.getElementById('form-title').innerText = "CRLN LFT";
        document.getElementById('btnCancelar').style.display = "none";
        verificarDuplicidade(); 
        
        imageBase64 = "";
        preview.style.display = 'none';
        pasteArea.classList.remove('active');
        pasteArea.innerHTML = `Clique aqui e aperte <strong>Ctrl + V</strong> para colar um print<img id="preview" class="preview-img" alt="Preview do print">`;
    }

    document.getElementById('btnCancelar').addEventListener('click', resetarFormulario);

    window.onload = function() {
        renderBusca();
        carregarCache()
            .then(() => { renderBusca(); verificarDuplicidade(); })
            .catch(err => {
                console.error('Erro ao carregar a base:', err);
                document.getElementById('resultsList').innerHTML =
                    '<p style="color: #ff6b6b;">Erro ao carregar a base. Clique em "Atualizar lista" para tentar de novo.</p>';
            });
    };
</script>
</body>
</html>
